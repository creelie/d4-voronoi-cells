name: Publish integrated d424 manuscript
on:
  push:
    branches: [main]
    paths: [revision-v3.3.0/release.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed assets
        working-directory: revision-v3.3.0
        run: |
          sha256sum -c SHA256SUMS.txt
          python -m zipfile -t d424tex.zip
          python -m zipfile -t d424.zip
      - name: Publish or refresh assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          folder=revision-v3.3.0
          title='The Sphere Packing Problem in Dimension 4 and the Twenty-Four-Cell Conjecture'
          if gh release view v3.3.0 >/dev/null 2>&1; then
            gh release upload v3.3.0 "$folder/d424.pdf" "$folder/d424tex.zip" "$folder/d424.zip" "$folder/SHA256SUMS.txt" --clobber
            gh release edit v3.3.0 --title "$title" --notes-file "$folder/RELEASE-NOTES.md"
          else
            gh release create v3.3.0 "$folder/d424.pdf" "$folder/d424tex.zip" "$folder/d424.zip" "$folder/SHA256SUMS.txt" --target "$(git rev-parse HEAD)" --title "$title" --notes-file "$folder/RELEASE-NOTES.md"
          fi
