name: Publish D4–24 manuscript v3.2.0
on:
  push:
    branches: [main]
    paths: [paper/revision-v3.2.0/release.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archived assets
        working-directory: paper/revision-v3.2.0
        run: |
          sha256sum -c SHA256SUMS.txt
          python -m zipfile -t D4-24tex.zip
      - name: Publish or refresh assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          folder=paper/revision-v3.2.0
          title='The Sphere Packing Problem in Dimension 4 and the Twenty-Four-Cell Conjecture'
          if gh release view v3.2.0 >/dev/null 2>&1; then
            gh release upload v3.2.0 "$folder/D4-24.pdf" "$folder/D4-24tex.zip" "$folder/SHA256SUMS.txt" --clobber
            gh release edit v3.2.0 --title "$title" --notes-file "$folder/RELEASE-NOTES.md"
          else
            gh release create v3.2.0 "$folder/D4-24.pdf" "$folder/D4-24tex.zip" "$folder/SHA256SUMS.txt" --target "$(git rev-parse HEAD)" --title "$title" --notes-file "$folder/RELEASE-NOTES.md"
          fi
